<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>荷物引渡し管理</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <meta name="theme-color" content="#073f6e">
</head>
<body>
  <header class="appbar"></header>
  <main>
    <div id="summary" class="note info" hidden></div>

    <nav class="menu">
      <a href="/scan">
        <span class="ico" aria-hidden="true">📷</span>
        <strong>QRを読み取る</strong>
        <span>お客様のQRコードを読み取り、内容を確認してサインをもらいます（スマホ）</span>
      </a>
      <a href="/issue">
        <span class="ico" aria-hidden="true">📝</span>
        <strong>引渡票を発行する</strong>
        <span>お客様情報を登録してQRコードを発行します（事務PC）</span>
      </a>
      <a href="/list">
        <span class="ico" aria-hidden="true">📋</span>
        <strong>一覧・履歴</strong>
        <span>発行済み／引渡済みの検索、再発行、CSV書き出し</span>
      </a>
      <a href="/connect">
        <span class="ico" aria-hidden="true">📱</span>
        <strong>スマホ・他のPCをつなぐ</strong>
        <span>スマホや他の事務PCからこのアプリを開く方法と、読み取りの動作確認</span>
      </a>
      <a href="/users" id="usersLink" hidden>
        <span class="ico" aria-hidden="true">👥</span>
        <strong>担当者の管理</strong>
        <span>アカウントの追加、パスワードの再発行（管理者のみ）</span>
      </a>
    </nav>
  </main>
  <script type="module" src="/js/menu.js"></script>
</body>
</html>
