<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>引渡票｜荷物引渡し管理</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/sheet.css">
  <link rel="icon" href="/icon.svg">
</head>
<body>
  <header class="appbar no-print"></header>
  <main>
    <div class="note info no-print">
      <strong>お客様への渡し方</strong>
      <b>FAX</b>の場合はこのまま［印刷］して送信してください（<b>ファインモード以上</b>を推奨）。<br>
      <b>メール</b>の場合は［PDFで保存］または［QR画像をダウンロード］を添付してください。
    </div>

    <div class="note warn no-print">
      <strong>荷物側のラベルもお忘れなく</strong>
      引取り時の二重チェックに使う<b>荷物ラベル</b>を印刷して、1箱に1枚ずつ貼ってください。
    </div>

    <div class="actions no-print">
      <button class="btn primary" id="printBtn">印刷 / FAX用に出力</button>
      <button class="btn" id="pdfBtn">PDFで保存</button>
      <a class="btn" id="pngBtn" download>QR画像をダウンロード</a>
      <a class="btn primary" id="labelsLink" href="#">荷物ラベルを印刷</a>
      <a class="btn ghost" id="detailLink" href="#">詳細・履歴を見る</a>
    </div>

    <div class="card sheet" id="sheet" aria-busy="true">
      <p class="loading">読み込み中…</p>
    </div>
  </main>
  <script type="module" src="/js/sheet.js"></script>
</body>
</html>
