<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>荷物ラベル｜荷物引渡し管理</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/labels.css">
  <link rel="icon" href="/icon.svg">
</head>
<body>
  <header class="appbar no-print"></header>
  <main class="wide">
    <div class="note info no-print">
      <strong>荷物ラベルの使い方</strong>
      個数ぶんのラベルを印刷し、<b>1箱に1枚ずつ</b>貼ってください。<br>
      引取り時にお客様のQRを読み取ったあと、この荷物ラベルを1箱ずつ読み取ると、
      別のお客様の荷物が混ざっていないか自動で確認できます。
    </div>

    <div class="actions no-print">
      <button class="btn primary" id="printBtn">印刷する</button>
      <a class="btn ghost" id="sheetLink" href="#">お客様用の引渡票を見る</a>
      <a class="btn ghost" id="detailLink" href="#">詳細・履歴を見る</a>
    </div>

    <div id="labels" aria-busy="true"><p class="empty">読み込み中…</p></div>
  </main>
  <script type="module" src="/js/labels.js"></script>
</body>
</html>
