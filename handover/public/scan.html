<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QR読み取り｜荷物引渡し管理</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/scan.css">
  <link rel="icon" href="/icon.svg">
  <meta name="theme-color" content="#073f6e">
</head>
<body>
  <header class="appbar"></header>
  <main>

    <ol class="steps" id="steps">
      <li data-step="customer"><span class="n">1</span>お客様QR</li>
      <li data-step="packages"><span class="n">2</span>荷物QR</li>
      <li data-step="sign"><span class="n">3</span>サイン</li>
    </ol>

    <!-- 読み取り（お客様QR・荷物QR 共通） -->
    <section id="scanStage">
      <div class="scanner">
        <video id="video" playsinline muted autoplay></video>
        <div class="reticle" aria-hidden="true"></div>
        <button class="torch" id="torchBtn" type="button" hidden aria-pressed="false" title="ライト">🔦</button>
        <p class="scanner-msg" id="scannerMsg">カメラを準備しています…</p>
      </div>

      <div id="scanAlert" role="alert"></div>
      <div id="scanContext"></div>

      <div class="card">
        <h2>番号を手入力</h2>
        <p class="hint" style="margin-top:-8px">
          QRが汚れている・FAXが不鮮明で読み取れないときは、印字された番号を入力してください。
        </p>
        <form id="manualForm" class="input-row">
          <input id="manualToken" inputmode="latin" autocapitalize="characters" autocomplete="off"
                 spellcheck="false" placeholder="XXXX-XXXX-XXXX">
          <button class="btn primary" type="submit">照会</button>
        </form>
      </div>

      <div class="actions">
        <button class="btn" type="button" id="restartBtn" hidden>最初からやり直す</button>
      </div>
    </section>

    <!-- サイン -->
    <section id="signStage" hidden>
      <div class="card">
        <h2>お荷物の内容</h2>
        <div id="signHandoverInfo"></div>
        <div id="signPackageSummary" style="margin-top:14px"></div>
      </div>

      <form id="receiveForm">
        <div class="card">
          <h2>引き取られる方の確認</h2>
          <div class="grid">
            <div>
              <label for="receiverRelation">お引取りの方</label>
              <select id="receiverRelation" name="receiverRelation">
                <option value="self">ご本人</option>
                <option value="agent">代理の方</option>
              </select>
            </div>
            <div>
              <label for="receiverName">引き取られる方のお名前 <span class="req" aria-hidden="true">*</span></label>
              <input id="receiverName" name="receiverName" required maxlength="100" autocomplete="off">
              <p class="hint" id="receiverHint"></p>
            </div>
            <div class="full">
              <label for="receiveNote">引渡時の備考</label>
              <input id="receiveNote" name="receiveNote" maxlength="500" autocomplete="off"
                     placeholder="例）1箱に破損あり・お客様了承済み">
            </div>
          </div>
        </div>

        <div class="card">
          <h2>受領サイン <span class="req" aria-hidden="true">*</span></h2>
          <p class="hint" style="margin-top:-8px">
            <b id="signPrompt">引き取られるご本人</b>に、画面の枠内へ指でサインをお願いします。
          </p>
          <div class="sign-area">
            <canvas id="signCanvas" aria-label="サイン記入欄"></canvas>
            <div class="sign-baseline" aria-hidden="true"></div>
            <span class="sign-placeholder">ここにサインしてください</span>
          </div>
          <div class="actions" style="margin-top:12px">
            <button class="btn" type="button" id="undoBtn">ひとつ戻す</button>
            <button class="btn" type="button" id="clearBtn">全部消す</button>
          </div>
        </div>

        <div class="actions">
          <button class="btn" type="button" id="backToScanBtn">読み取りに戻る</button>
          <button class="btn primary big" type="submit" id="completeBtn" style="flex:1" disabled>
            引渡しを確定する
          </button>
        </div>
      </form>
    </section>

    <!-- 完了 -->
    <section id="doneView" hidden>
      <div class="done-mark" aria-hidden="true">✓</div>
      <div class="note ok" style="text-align:center;font-size:18px">
        <strong style="font-size:22px">引渡しが完了しました</strong>
        <span id="doneSummary"></span>
      </div>
      <div id="doneInfo" class="card"></div>
      <div class="actions">
        <button class="btn primary big" type="button" id="againBtn">続けて次のお客様を読み取る</button>
        <a class="btn" href="/" style="width:100%">メニューに戻る</a>
      </div>
    </section>

  </main>
  <script type="module" src="/js/scan.js"></script>
</body>
</html>
