<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>時間外受取シート｜荷物引渡し管理</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/sheet.css">
  <link rel="stylesheet" href="/css/pickup-sheet.css">
  <link rel="icon" href="/icon.svg">
</head>
<body>
  <header class="appbar no-print"></header>
  <main>
    <div class="note info no-print">
      <strong>時間外受取シートの使い方</strong>
      このシートを印刷し、<b>受領書・送り状と一緒にワゴンへ置いて</b>ください。<br>
      お客様がスマホのカメラでQRを読み取ると、内容の確認画面と受け取りサインの画面が開きます。
    </div>

    <div id="warn"></div>

    <div class="actions no-print">
      <button class="btn primary" id="printBtn">印刷する</button>
      <a class="btn ghost" id="detailLink" href="#">詳細・履歴を見る</a>
    </div>

    <div class="card sheet" id="sheet" aria-busy="true">
      <p class="loading">読み込み中…</p>
    </div>
  </main>
  <script type="module" src="/js/pickup-sheet.js"></script>
</body>
</html>
