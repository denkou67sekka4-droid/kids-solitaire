<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>一覧・履歴｜荷物引渡し管理</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/icon.svg">
</head>
<body>
  <header class="appbar"></header>
  <main class="wide">
    <div class="card">
      <form id="filterForm" style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end">
        <div style="flex:2;min-width:220px">
          <label for="q">検索</label>
          <input id="q" name="q" placeholder="お客様名・会社名・電話・受注番号・引渡番号" autocomplete="off">
        </div>
        <div style="flex:1;min-width:140px">
          <label for="status">状態</label>
          <select id="status" name="status">
            <option value="">すべて</option>
            <option value="issued">発行済（未引渡）</option>
            <option value="completed">引渡済</option>
            <option value="cancelled">取消</option>
          </select>
        </div>
        <button class="btn primary" type="submit">検索</button>
        <a class="btn" id="csvLink" href="/api/export.csv">CSV書き出し</a>
        <a class="btn primary" href="/issue">＋ 新規発行</a>
      </form>
    </div>

    <div class="card">
      <div id="summary" class="hint" style="margin-bottom:10px"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>状態</th><th>引渡番号</th><th>お客様名</th><th>会社名</th>
              <th>品名</th><th>個数</th><th>引取期限</th><th>発行日時</th><th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" hidden>該当する引渡票はありません。</div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="moreBtn" hidden>さらに読み込む</button>
      </div>
    </div>
  </main>
  <script type="module" src="/js/list.js"></script>
</body>
</html>
