<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スマホ・他のPCをつなぐ｜荷物引渡し管理</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/icon.svg">
  <style>
    .conn { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; }
    @media (max-width: 620px) { .conn { grid-template-columns: 1fr; } }
    .conn img {
      display: block;
      width: 45mm; height: 45mm;
      image-rendering: pixelated;
      border: 8px solid #fff;
      background: #fff;
    }
    .conn .url {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 700;
      word-break: break-all;
      user-select: all;
      margin-bottom: 8px;
    }
    .steps-num { margin: 0; padding-left: 1.4em; line-height: 2; }
    .steps-num li { margin-bottom: 4px; }
  </style>
</head>
<body>
  <header class="appbar"></header>
  <main>
    <div id="content" aria-busy="true">
      <p class="empty">読み込み中…</p>
    </div>
  </main>
  <script type="module" src="/js/connect.js"></script>
</body>
</html>
